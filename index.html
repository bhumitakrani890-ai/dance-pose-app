<!DOCTYPE html>
<html>
<head>
  <title>Dance Pose App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Dance Pose Trainer</h1>

  <div class="video-container">
    <div class="video-box">
      <h2>Reference Video</h2>
      <video id="referenceVideo" controls width="400" src="reference.mp4"></video>
    </div>

    <div class="video-box">
      <h2>Your Webcam</h2>
      <video id="webcam" width="400" autoplay muted></video>
      <canvas id="overlay" width="400" height="300"></canvas>
    </div>
  </div>

  <button id="startButton">Start Camera</button>
  <p id="status">Status: Not started</p>
  <p id="matchScore" style="font-size: 24px; font-weight: bold;">Match Score: --</p>

  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script><script src="script.js"></script>
</body>
</html>
